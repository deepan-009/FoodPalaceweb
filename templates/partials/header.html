<header class="masthead">
  <div class="shell masthead__inner">
    <a href="{% url 'core:home' %}" class="wordmark">
      <span class="wordmark__seal" aria-hidden="true">FP</span>
      <span>
        <span class="wordmark__name">Food Palace</span>
        <span class="wordmark__sub">{{ site.tagline }}</span>
      </span>
    </a>

    <nav class="nav" id="site-nav" aria-label="Main">
      <a href="{% url 'core:home' %}" {% if active == 'home' %}class="is-active" aria-current="page"{% endif %}>Home</a>
      <a href="{% url 'core:menu' %}" {% if active == 'menu' %}class="is-active" aria-current="page"{% endif %}>Menu</a>
      <a href="{% url 'core:about' %}" {% if active == 'about' %}class="is-active" aria-current="page"{% endif %}>About us</a>
      <a href="{% url 'core:awards' %}" {% if active == 'awards' %}class="is-active" aria-current="page"{% endif %}>Awards</a>
      <a href="{% url 'core:reviews' %}" {% if active == 'reviews' %}class="is-active" aria-current="page"{% endif %}>Reviews</a>
      <a href="{% url 'core:contact' %}" {% if active == 'contact' %}class="is-active" aria-current="page"{% endif %}>Contact</a>
    </nav>

    <div style="display:flex; align-items:center; gap:.6rem">
      <span class="status masthead__status" data-status>
        <span class="status__dot"></span>
        <span data-status-text>Checking hours</span>
      </span>
      <a href="tel:{{ site.phone_primary }}" class="btn btn--gold" style="padding:.7rem 1.25rem; font-size:.88rem">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.4-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>
        </svg>
        Call to order
      </a>
      <button class="nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false" aria-label="Open menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
    </div>
  </div>
</header>
